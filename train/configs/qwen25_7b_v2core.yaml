# ─────────────────────────────────────────────────────────────────────────────
# lambda-zero GRPO config — Reward Design v2 CORE (single GATED paired reward)
# Used ONLY by train/grpo_train_v2.py. NOT interchangeable with qwen25_7b.yaml:
# there is no delta_file here (v2 uses ownership consistency GATED by the frozen
# anchor), the dataset is filtered to stable-anchor cases, and the batch geometry
# is set up for paired X/Y sampling.
# Gated table: keep/trade-both = -1 | consistent-wrong-pref = 0 | consistent-anchored = +1
# ─────────────────────────────────────────────────────────────────────────────

# ── Model ──────────────────────────────────────────────────────────────────
model_name_or_path: models/Qwen2.5-7B-Instruct
goods_file: everyday_goods_full.json

# ── LoRA ───────────────────────────────────────────────────────────────────
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# ── Reward v2-core ──────────────────────────────────────────────────────────
# Single gated paired reward (r_gated). No sub-weights: the anchor-direction
# credit is GATED behind the ownership-consistency gate, not added to it.
# reward_weights is fixed to [1.0] in grpo_train_v2.build_grpo_config_v2.
#
# reward_mode:
#   shaped — three-level ladder (-1 inconsistent/malformed, 0 consistent-wrong-pref,
#            +1 consistent-anchored). Consistency is the primary gate out of the
#            penalty region (this reduces λ); direction refines 0→+1. Three levels
#            also give richer within-group variance → less zero-std collapse.
#   hard   — binary (+1 iff consistent AND anchored, else -1). Directly optimizes
#            the rational outcome; no intermediate credit.
reward_mode: shaped

# ── GRPO algorithm ─────────────────────────────────────────────────────────
num_generations: 16              # G completions per PERSPECTIVE (X gets 16, Y gets 16)
# Paired batch geometry. Do NOT set generation_batch_size OR steps_per_generation
# (TRL forbids setting both, and derives generation_batch_size from these two):
#   generation_batch_size = per_device_train_batch_size * num_proc * grad_accum
# per_device=1, grad_accum=32 → generation_batch_size = 32 = one whole X/Y pair
# (2 prompts x G=16). Must be a multiple of 2*num_generations (32) to hold whole
# pairs; increase grad_accum to 64/96/... for 2/3/... pairs per generation.
per_device_train_batch_size: 1
gradient_accumulation_steps: 32

temperature: 1.5                 # >= 1.0 — base dist is ~99% "No"; keep it diverse
epsilon: 0.2
beta: 0.04
max_completion_length: 4
loss_type: dapo
scale_rewards: "none"
mask_truncated_completions: true
shuffle_dataset: true            # PairedRepeatSampler shuffles at PAIR granularity

# ── Training ───────────────────────────────────────────────────────────────
learning_rate: 1.0e-6
num_train_epochs: 1
max_steps: -1
max_grad_norm: 0.1
warmup_ratio: 0.05
lr_scheduler_type: cosine
bf16: true
dataloader_num_workers: 0

# ── Logging / saving ───────────────────────────────────────────────────────
logging_steps: 5                 # frequent for the sanity run
save_steps: 200
report_to: none
log_completions: true

# ── vLLM (disabled on NSCC — see qwen25_7b.yaml note) ───────────────────────
use_vllm: false
